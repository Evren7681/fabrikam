    sdk: flutter
  supabase_flutter: ^2.5.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0
  connectivity_plus: ^6.0.3
  uuid: ^4.4.0
  intl: ^0.19.0
  pdf: ^3.10.8
